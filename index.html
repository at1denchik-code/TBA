<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог книг</title>
    <!-- Подключение Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            margin-bottom: 28px;
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        header p {
            color: var(--text-muted);
            margin-top: 6px;
            font-size: 0.95rem;
        }

        /* Панель управления (поиск и сортировка) */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .search-wrapper {
            position: relative;
            flex: 1;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
            background-color: #fff;
            color: var(--text-main);
            font-family: inherit;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        select {
            cursor: pointer;
            width: auto;
            min-width: 180px;
        }

        /* Ошибки */
        .error-box {
            display: none;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 14px 16px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        /* Таблица */
        .table-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: #f1f5f9;
        }

        th {
            padding: 16px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 16px;
            font-size: 0.95rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr {
            transition: background-color 0.15s ease;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        .author-badge {
            display: inline-block;
            background-color: #eef2ff;
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .year-text {
            color: var(--text-muted);
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 32px !important;
        }

        /* Адаптивность для мобилок */
        @media (max-width: 640px) {
            .controls {
                flex-direction: column;
            }
            select {
                width: 100%;
            }
            th, td {
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📚 Каталог книг</h1>
            <p>База данных Supabase с поиском и сортировкой</p>
        </header>

        <div id="debugError" class="error-box"></div>

        <div class="controls">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Поиск по названию или автору..." oninput="loadBooks()">
            </div>
            
            <select id="sortSelect" onchange="loadBooks()">
                <option value="title_asc">Название (А-Я)</option>
                <option value="title_desc">Название (Я-А)</option>
                <option value="year_desc">Сначала новые</option>
                <option value="year_asc">Сначала старые</option>
            </select>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Название книги</th>
                        <th>Автор</th>
                        <th>Год издания</th>
                    </tr>
                </thead>
                <tbody id="booksTableBody">
                    <tr><td colspan="3" class="empty-state">Загрузка данных...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Конфигурация Supabase
        const SUPABASE_URL = 'https://lremdhftyxsqzlksqzyz.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyZW1kaGZ0eXhzcXpsa3Nxenl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0Mjg2NjAsImV4cCI6MjEwNzAwNDY2MH0.PIybODD8t0RLI4mgWdijEl52rx-rhA4-csqwl-wZO4Y';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadBooks() {
            const searchQuery = document.getElementById('searchInput').value.trim();
            const sortOption = document.getElementById('sortSelect').value;
            const tableBody = document.getElementById('booksTableBody');
            const debugError = document.getElementById('debugError');

            debugError.style.display = 'none';

            let query = supabaseClient
                .from('books')
                .select('id, title, publication_year, authors(name)');

            if (searchQuery) {
                query = query.or(`title.ilike.%${searchQuery}%,authors.name.ilike.%${searchQuery}%`);
            }

            if (sortOption === 'title_asc') query = query.order('title', { ascending: true });
            if (sortOption === 'title_desc') query = query.order('title', { ascending: false });
            if (sortOption === 'year_asc') query = query.order('publication_year', { ascending: true });
            if (sortOption === 'year_desc') query = query.order('publication_year', { ascending: false });

            const { data: books, error } = await query;

            if (error) {
                console.error('Ошибка Supabase:', error);
                debugError.innerText = `Ошибка: ${error.message}`;
                debugError.style.display = 'block';
                tableBody.innerHTML = `<tr><td colspan="3" class="empty-state">Не удалось загрузить данные</td></tr>`;
                return;
            }

            if (!books || books.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3" class="empty-state">Ничего не найдено 🔍</td></tr>`;
                return;
            }

            tableBody.innerHTML = books.map(book => `
                <tr>
                    <td><strong>${escapeHtml(book.title)}</strong></td>
                    <td><span class="author-badge">${escapeHtml(book.authors ? book.authors.name : 'Неизвестен')}</span></td>
                    <td><span class="year-text">${book.publication_year || '—'}</span></td>
                </tr>
            `).join('');
        }

        function escapeHtml(text) {
            return (text || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[m]);
        }

        loadBooks();
    </script>
</body>
</html>
