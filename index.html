<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог книг</title>
    <!-- Подключение Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 10px; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input, select { padding: 8px; font-size: 14px; }
        input { flex-grow: 1; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <h1>Каталог книг</h1>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Поиск по названию или автору..." oninput="loadBooks()">
        
        <select id="sortSelect" onchange="loadBooks()">
            <option value="title_asc">Название (А-Я)</option>
            <option value="title_desc">Название (Я-А)</option>
            <option value="year_desc">Сначала новые</option>
            <option value="year_asc">Сначала старые</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Название книги</th>
                <th>Автор</th>
                <th>Год издания</th>
            </tr>
        </thead>
        <tbody id="booksTableBody">
            <tr><td colspan="3">Загрузка...</td></tr>
        </tbody>
    </table>

    <script>
        // Конфигурация Supabase
        const SUPABASE_URL = 'https://lremdhftyxsqzlksqzyz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_RoLu6Noj3fpkTyO3-kVdFg_r8whfgo0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadBooks() {
            const searchQuery = document.getElementById('searchInput').value.trim();
            const sortOption = document.getElementById('sortSelect').value;
            const tableBody = document.getElementById('booksTableBody');

            // Выбор столбцов и объединение таблиц (JOIN через foreign key)
            let query = supabaseClient
                .from('books')
                .select(`
                    id,
                    title,
                    publication_year,
                    authors!inner ( name )
                `);

            // Фильтрация (Поиск по названию книги или имени автора)
            if (searchQuery) {
                query = query.or(`title.ilike.%${searchQuery}%,authors.name.ilike.%${searchQuery}%`);
            }

            // Сортировка
            switch (sortOption) {
                case 'title_asc':
                    query = query.order('title', { ascending: true });
                    break;
                case 'title_desc':
                    query = query.order('title', { ascending: false });
                    break;
                case 'year_asc':
                    query = query.order('publication_year', { ascending: true });
                    break;
                case 'year_desc':
                    query = query.order('publication_year', { ascending: false });
                    break;
            }

            const { data: books, error } = await query;

            if (error) {
                console.error('Ошибка загрузки:', error);
                tableBody.innerHTML = `<tr><td colspan="3">Ошибка загрузки данных</td></tr>`;
                return;
            }

            if (books.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3">Ничего не найдено</td></tr>`;
                return;
            }

            // Отрисовка результатов
            tableBody.innerHTML = books.map(book => `
                <tr>
                    <td>${escapeHtml(book.title)}</td>
                    <td>${escapeHtml(book.authors ? book.authors.name : 'Неизвестен')}</td>
                    <td>${book.publication_year || '—'}</td>
                </tr>
            `).join('');
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[m]);
        }

        // Загрузка при открытии страницы
        loadBooks();
    </script>
</body>
</html>
